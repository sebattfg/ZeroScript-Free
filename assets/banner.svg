<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="780" viewBox="0 0 1560 780" role="img" aria-label="NonZeroScript - Free AI Agent for Godot 4.7.2">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1017"/>
      <stop offset="0.55" stop-color="#11141d"/>
      <stop offset="1" stop-color="#0a0d14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M 52 0 L 0 0 0 52" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1560" height="780" fill="url(#bg)"/>
  <rect width="1560" height="780" fill="url(#grid)"/>
  <ellipse cx="430" cy="390" rx="620" ry="420" fill="url(#glow)"/>
  <ellipse cx="1280" cy="120" rx="420" ry="300" fill="url(#glow)" opacity="0.5"/>

  <!-- logo -->
  <rect x="92" y="74" width="54" height="54" rx="15" fill="url(#logo)"/>
  <text x="119" y="111" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#ffffff">&lt;/&gt;</text>
  <circle cx="139" cy="121" r="5" fill="#34d399"/>
  <text x="164" y="112" font-family="Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#ffffff">NonZeroScript</text>

  <text x="92" y="188" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" font-weight="600" fill="#818cf8" letter-spacing="4">OFFICIAL ZEROSCRIPT DERIVATIVE  /  GODOT 4.7.2 EDITION</text>

  <!-- decorative brackets -->
  <path d="M 150 330 L 92 390 L 150 450" fill="none" stroke="#ffffff" stroke-opacity="0.72" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 1410 330 L 1468 390 L 1410 450" fill="none" stroke="#ffffff" stroke-opacity="0.72" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="780" y="360" text-anchor="middle" font-family="Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="72" font-weight="800" fill="#ffffff">Chat your Godot game</text>
  <text x="780" y="448" text-anchor="middle" font-family="Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="72" font-weight="800" fill="#ffffff">into existence. <tspan fill="#818cf8">Free.</tspan></text>

  <text x="780" y="512" text-anchor="middle" font-family="Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="24" fill="#9aa0b4">Browser extension · Visual controller · Godot editor plugin — no API key, no credits, no terminal.</text>

  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="16" fill="#7d8499" text-anchor="middle">
    <text x="780" y="642">8 AI models  ·  multi-browser rotation  ·  timeline memory  ·  random input delay  ·  open source</text>
  </g>

  <rect x="640" y="700" width="280" height="2" rx="1" fill="url(#accent)" opacity="0.7"/>
</svg>

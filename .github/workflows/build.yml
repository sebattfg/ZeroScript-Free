name: Build

# 构建脚本：打四个下载包，每个包一个独立 artifact，在 Actions 页面单独下载。
# 仓库不发 GitHub Release；dist/ 里的包随代码一起提交，这里只是再打一份。
#
# 手动运行：Actions -> Build -> Run workflow

on:
  push:
    branches: ["v0.1.0-dev"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check versions and prompt docs
        run: python .github/build.py --check

      - name: Build controller.zip / extension.zip / editor-godot-4.7.2.zip / prompts.zip
        run: python .github/build.py

      - name: Show what was built
        run: |
          ls -lh dist
          cat dist/SHA256SUMS.txt

      - name: Upload controller.zip
        uses: actions/upload-artifact@v7
        with:
          name: controller.zip
          path: dist/controller.zip
          compression-level: 0
          if-no-files-found: error

      - name: Upload extension.zip
        uses: actions/upload-artifact@v7
        with:
          name: extension.zip
          path: dist/extension.zip
          compression-level: 0
          if-no-files-found: error

      - name: Upload editor-godot-4.7.2.zip
        uses: actions/upload-artifact@v7
        with:
          name: editor-godot-4.7.2.zip
          path: dist/editor-godot-4.7.2.zip
          compression-level: 0
          if-no-files-found: error

      - name: Upload prompts.zip
        uses: actions/upload-artifact@v7
        with:
          name: prompts.zip
          path: dist/prompts.zip
          compression-level: 0
          if-no-files-found: error

      - name: Upload SHA256SUMS.txt
        uses: actions/upload-artifact@v7
        with:
          name: SHA256SUMS.txt
          path: dist/SHA256SUMS.txt
          compression-level: 0
          if-no-files-found: error
